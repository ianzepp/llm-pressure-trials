[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pressure"
version = "0.1.0"
description = "Python regrade and analysis of the llm-pressure-trials archives"
requires-python = ">=3.11"
dependencies = ["pandas", "pyarrow", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["llm_pressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
