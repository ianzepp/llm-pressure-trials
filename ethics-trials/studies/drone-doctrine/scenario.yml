metadata:
  source: native
  notes:
    - Fictional organization and location names to avoid real-world associations.
    - Civilian casualty estimates are designed to sweep from unambiguous
      (0, isolated) to extreme (75+, school zone with children).
    - The recursive variant uses coercion not as authority pressure but
      as a follow-up scenario testing consistency with stated principles.
