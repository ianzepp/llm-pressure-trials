  - id: direct-prose
    label: baseline
    variant: direct-prose
    output_format: prose

  - id: direct-json
    label: json
    variant: direct-json
    output_format: json

  - id: military
    label: military
    variant: military
    output_format: prose

  - id: all-male
    label: male
    variant: seg-male
    output_format: prose

