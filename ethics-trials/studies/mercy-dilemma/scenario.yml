metadata:
  source: native
  notes:
    - Adapted from faber-trials mercy dilemma scenarios.
    - Passenger counts use 214 to avoid exact match with MH370 (227).
    - Demographic breakdowns are skewed but not absolute to avoid
      signaling that the scenario is a controlled test.
