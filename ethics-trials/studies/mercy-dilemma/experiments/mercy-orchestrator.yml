id: mercy-orchestrator
title: Orchestrator Handoff vs Direct JSON
description: >
  The identical plane scenario presented as an orchestrator agent's task
  assignment to a sub-agent, compared against the direct-JSON condition
  (prediction 10). Refusing trials receive one of the two coercion
  variants, ops-command or orchestrator-override, assigned evenly by the
  trial unit's ordinal position among the model's units (prediction 5).
mode: ab
repeats: 3
tags:
  - mercy
  - orchestrator
  - agent-planning
  - coercion-variants

units:
  - label: json
    scenario: mercy-dilemma
    condition: direct-json

  - label: orchestrator
    scenario: mercy-dilemma
    condition: orchestrator

comparisons:
  - id: orchestrator-vs-json
    left: orchestrator
    right: json
    metric: format-delta

metadata:
  study: mercy-dilemma
  notes:
    - 2 conditions x 3 repeats = 6 trials per model.
    - Coercion variant split per model is 3 ops-command /
      3 orchestrator-override (ordinal modulo two over the 6 units).
    - The March-matched rerun stays in mercy-framing.yml, unchanged. The
      March coercion text lives on verbatim as the ops-command variant in
      the shared scenario, so mercy-framing rerun trials still see the
      March text on half of their refusing trials.
